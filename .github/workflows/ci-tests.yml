name: Pytest/Test Workflow

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: pytest-test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


jobs:
  build-pkg:
    uses: ./.github/workflows/build-package.yml
    with:
      link-check: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

  run-tests:
    name: Test ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and set Python version
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true

      - name: Install project, development, and metrics dependencies
        run: uv sync --frozen --group dev --extra metrics

      - name: Verify package imports and version
        run: python -c "import supervision; import supervision.assets; import supervision.metrics; print(supervision.__version__)"

      - name: Run tests with coverage
        run: pytest src tests --cov=supervision --cov-report=xml

      - name: Display coverage summary
        if: success()
        run: coverage report --show-missing

      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: cpu,${{ runner.os }},${{ matrix.python-version }}
          fail_ci_if_error: false

  testing-guardian:
    name: Testing Guardian
    needs: run-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Show test result
        run: echo "run-tests result: ${{ needs.run-tests.result }}"

      - name: Enforce test gate
        if: needs.run-tests.result != 'success'
        run: |
          echo "run-tests did not succeed (result: ${{ needs.run-tests.result }})."
          exit 1
